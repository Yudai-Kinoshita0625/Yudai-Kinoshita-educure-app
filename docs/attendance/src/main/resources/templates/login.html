<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン - 勤怠管理システム</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center border border-gray-200">
<h1 class="text-2xl font-bold text-blue-600 mb-2">勤怠管理システム</h1>
<p class="text-gray-500 mb-8 font-medium">ログインして利用を開始してください</p>

<div th:if="${error}" class="mb-6 p-4 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200">
<p th:text="${error}"></p>
</div>

<form th:action="@{/login}" method="post" class="space-y-6">
<div class="text-left">
<label for="userId" class="block text-sm font-semibold text-gray-700 mb-2">ユーザーID</label>
<input type="text" id="userId" name="userId" required
class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-gray-50"
placeholder="ユーザーIDを入力">
</div>

<div class="text-left">
<label for="password" class="block text-sm font-semibold text-gray-700 mb-2">パスワード</label>
<input type="password" id="password" name="password" required
class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-gray-50"
placeholder="パスワードを入力">
</div>

<div class="pt-4">
<button type="submit"
class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 active:transform active:scale-95 transition shadow-lg">
ログイン
</button>
</div>
</form>
</div>

</body>
</html>
