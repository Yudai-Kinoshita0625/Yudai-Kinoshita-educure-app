<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠管理システム</title>
<link rel="stylesheet" th:href="@{/css/attendance.css}">
<style>
:root { --sun-color: #ff4d4d; --sat-color: #4d79ff; --today-bg: #fffde7; --today-border: #ff9800; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.admin-link { font-size: 0.8em; color: #3b82f6; text-decoration: none; border: 1px solid #3b82f6; padding: 3px 10px; border-radius: 5px; }
.logout-link { font-size: 0.8em; color: #ef4444; text-decoration: none; }
.month-selector { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 1.4em; font-weight: bold; margin: 15px 0; }
.nav-arrows a { text-decoration: none; color: inherit; }
.nav-arrows span { cursor: pointer; padding: 5px 12px; border-radius: 8px; background: #f0f0f0; display: inline-block; }
.weather-box { background: #d1d5db; padding: 20px; border-radius: 15px; margin-bottom: 25px; text-align: left; }
.calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; background: #f3f4f6; padding: 12px 0; border: 1px solid #e5e7eb; border-radius: 8px 8px 0 0; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #e5e7eb; border: 1px solid #e5e7eb; border-radius: 0 0 8px 8px; }
.calendar-day { min-height: 85px; padding: 8px; background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
.calendar-day.today { background: var(--today-bg); outline: 2px solid var(--today-border); z-index: 1; }
.day-num { font-size: 1em; font-weight: bold; }
.work-hours { font-size: 0.75em; color: #6b7280; margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-top: 6px; }
.modal { display: none; position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
.modal-content { background: #fff; margin: 15% auto; padding: 25px; width: 85%; max-width: 400px; border-radius: 15px; }
</style>
</head>
<body>
<div class="container" style="max-width: 500px; margin: 0 auto; padding: 20px;">
<div class="header-top">
<a th:if="${user.role == 'ADMIN'}" th:href="@{/admin/menu}" class="admin-link">管理者メニュー</a>
<div th:unless="${user.role == 'ADMIN'}"></div> <a th:href="@{/logout}" class="logout-link">ログアウト</a>
</div>

<header>
<h1 style="text-align: center;" th:text="${user.name} + ' さんの勤怠'"></h1>
<div class="month-selector">
<span th:text="${targetMonth.year} + '年' + ${targetMonth.monthValue} + '月'"></span>
<div class="nav-arrows">
<a th:href="@{/attendance(year=${prevMonth.year}, month=${prevMonth.monthValue})}"><span>&lt;</span></a>
<a th:href="@{/attendance(year=${nextMonth.year}, month=${nextMonth.monthValue})}"><span>&gt;</span></a>
</div>
</div>
</header>

<section class="weather-box">
<div class="weather-main"><span th:text="${weatherEmoji}">☀️</span> <span th:text="${weatherText}">天気取得中...</span></div>
</section>

<div class="calendar-header">
<div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div style="color:var(--sat-color)">土</div><div style="color:var(--sun-color)">日</div>
</div>
<main class="calendar-grid">
<div th:each="item : ${displayList}"
class="calendar-day"
th:classappend="${item == null} ? 'empty' : (${item.date == today} ? 'today')"
th:data-date="${item != null ? #temporals.format(item.date, 'yyyy/MM/dd') : ''}"
th:data-in="${item != null && item.data != null && item.data.clockIn != null ? #temporals.format(item.data.clockIn, 'HH:mm') : '--:--'}"
th:data-out="${item != null && item.data != null && item.data.clockOut != null ? #temporals.format(item.data.clockOut, 'HH:mm') : '--:--'}"
th:data-hours="${item != null ? item.workingHours : ''}"
th:data-memo="${item != null && item.data != null ? item.data.memo : ''}"
onclick="handleDayClick(this)">

<th:block th:if="${item != null}">
<span class="day-num" th:text="${#temporals.format(item.date, 'd')}"></span>
<div class="work-hours" th:text="${item.workingHours}"></div>
<div th:if="${item.data != null}" class="status-dot"></div>
</th:block>
</div>
</main>

<footer style="margin-top: 25px;">
<div style="display: flex; gap: 10px; margin-bottom: 15px;">
<form th:action="@{/attendance/punch-in}" method="post" style="flex: 1;"><button type="submit" class="btn-in" style="width: 100%; padding: 15px; border-radius:10px; border:none; background:#3b82f6; color:white; font-weight:bold;">出勤</button></form>
<form th:action="@{/attendance/punch-out}" method="post" style="flex: 1;"><button type="submit" class="btn-out" style="width: 100%; padding: 15px; border-radius:10px; border:none; background:#ef4444; color:white; font-weight:bold;">退勤</button></form>
</div>
<form th:action="@{/attendance/memo-save}" method="post">
<input type="text" name="memo" maxlength="20" placeholder="本日のメモ (20文字まで)" style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;">
<button type="submit" style="width:100%; margin-top:10px; padding:10px; border-radius:8px; border:none; background:#4b5563; color:white;">保存</button>
</form>
</footer>

<div id="detailModal" class="modal" onclick="closeModal()">
<div class="modal-content" onclick="event.stopPropagation()">
<h3 id="modalDate"></h3><hr>
<p>出勤：<span id="modalIn"></span> / 退勤：<span id="modalOut"></span></p>
<p>実働：<span id="modalHours"></span></p>
<div style="background:#f3f4f6; padding:10px; border-radius:8px;">メモ：<span id="modalMemoDisplay"></span></div>
<button onclick="closeModal()" style="width:100%; margin-top:20px; padding:10px; border:none; background:#9ca3af; color:white; border-radius:8px;">閉じる</button>
</div>
</div>
</div>
<script>
function handleDayClick(el) {
const date = el.getAttribute('data-date'); if (!date) return;
document.getElementById('modalDate').innerText = date;
document.getElementById('modalIn').innerText = el.getAttribute('data-in');
document.getElementById('modalOut').innerText = el.getAttribute('data-out');
document.getElementById('modalHours').innerText = el.getAttribute('data-hours') || "---";
document.getElementById('modalMemoDisplay').innerText = el.getAttribute('data-memo') || "なし";
document.getElementById('detailModal').style.display = 'block';
}
function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
</script>
</body>
</html>
